<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#050b18"/>
      <stop offset="0.45" stop-color="#0a1a33"/>
      <stop offset="0.8" stop-color="#10294d"/>
      <stop offset="1" stop-color="#16345e"/>
    </linearGradient>
    <linearGradient id="aurora1" x1="0" y1="0" x2="1" y2="0.2">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#2dd4bf" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="aurora2" x1="0" y1="0" x2="1" y2="0.1">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#818cf8" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="moonglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#dbeafe" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#dbeafe" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ice1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bcd8ee"/>
      <stop offset="1" stop-color="#7fa8cc"/>
    </linearGradient>
    <linearGradient id="ice2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fb4d6"/>
      <stop offset="1" stop-color="#5b82ab"/>
    </linearGradient>
    <linearGradient id="ice3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5f83aa"/>
      <stop offset="1" stop-color="#3a5a80"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- stars -->
  <g fill="#dbeafe">
    <circle cx="120" cy="80" r="1.6" opacity="0.9"/><circle cx="310" cy="140" r="1.2" opacity="0.7"/>
    <circle cx="480" cy="60" r="1.8" opacity="0.8"/><circle cx="640" cy="180" r="1.1" opacity="0.6"/>
    <circle cx="760" cy="90" r="1.5" opacity="0.85"/><circle cx="920" cy="50" r="1.2" opacity="0.7"/>
    <circle cx="1080" cy="150" r="1.7" opacity="0.9"/><circle cx="1240" cy="70" r="1.2" opacity="0.65"/>
    <circle cx="1390" cy="130" r="1.6" opacity="0.8"/><circle cx="1500" cy="60" r="1.1" opacity="0.6"/>
    <circle cx="220" cy="220" r="1.1" opacity="0.55"/><circle cx="560" cy="260" r="1.3" opacity="0.6"/>
    <circle cx="840" cy="240" r="1.0" opacity="0.5"/><circle cx="1160" cy="230" r="1.4" opacity="0.7"/>
    <circle cx="1440" cy="250" r="1.2" opacity="0.6"/><circle cx="60" cy="180" r="1.3" opacity="0.7"/>
  </g>

  <!-- moon -->
  <circle cx="1330" cy="150" r="120" fill="url(#moonglow)"/>
  <circle cx="1330" cy="150" r="42" fill="#eaf3fb" opacity="0.95"/>
  <circle cx="1316" cy="140" r="38" fill="#f4f9fe" opacity="0.9"/>

  <!-- aurora bands -->
  <path d="M -50 240 C 300 140, 700 320, 1050 200 S 1500 120, 1700 210 L 1700 330 C 1350 260, 950 420, 550 300 S 100 260, -50 330 Z" fill="url(#aurora1)"/>
  <path d="M -50 330 C 350 240, 750 400, 1150 290 S 1550 220, 1700 300 L 1700 400 C 1300 340, 900 480, 500 370 S 80 340, -50 410 Z" fill="url(#aurora2)"/>

  <!-- distant icebergs -->
  <path d="M 0 640 L 180 560 L 360 645 L 520 585 L 700 660 L 1600 660 L 1600 900 L 0 900 Z" fill="#1c3a5e" opacity="0.85"/>
  <path d="M 900 655 L 1080 545 L 1260 640 L 1440 570 L 1600 650 L 1600 900 L 900 900 Z" fill="#274a72" opacity="0.8"/>

  <!-- main ice field -->
  <path d="M 0 740 C 250 700, 500 760, 800 730 S 1300 710, 1600 750 L 1600 900 L 0 900 Z" fill="url(#ice3)"/>
  <path d="M 0 810 C 300 780, 650 830, 1000 800 S 1450 790, 1600 820 L 1600 900 L 0 900 Z" fill="url(#ice2)" opacity="0.9"/>

  <!-- ice highlight ridge -->
  <path d="M 0 742 C 250 702, 500 762, 800 732" stroke="#d7e9f8" stroke-width="3" fill="none" opacity="0.5"/>

  <!-- penguins: mother + two chicks -->
  <g>
    <!-- big penguin -->
    <g transform="translate(420,600) scale(1.35)">
      <ellipse cx="0" cy="95" rx="58" ry="12" fill="#123" opacity="0.35"/>
      <ellipse cx="0" cy="48" rx="46" ry="60" fill="#0d1726"/>
      <ellipse cx="0" cy="58" rx="30" ry="42" fill="#e8f1f7"/>
      <circle cx="0" cy="-12" r="30" fill="#0d1726"/>
      <ellipse cx="0" cy="-4" rx="19" ry="17" fill="#e8f1f7"/>
      <circle cx="-11" cy="-18" r="4.5" fill="#0a0f16"/>
      <circle cx="11" cy="-18" r="4.5" fill="#0a0f16"/>
      <path d="M -7 -8 L 8 -4 L -7 0 Z" fill="#f5a623"/>
      <ellipse cx="-44" cy="42" rx="11" ry="30" fill="#0d1726" transform="rotate(14 -44 42)"/>
      <ellipse cx="44" cy="42" rx="11" ry="30" fill="#0d1726" transform="rotate(-14 44 42)"/>
      <ellipse cx="-20" cy="106" rx="14" ry="6" fill="#f5a623"/>
      <ellipse cx="20" cy="106" rx="14" ry="6" fill="#f5a623"/>
    </g>
    <!-- chick looking up -->
    <g transform="translate(560,672) scale(0.72)">
      <ellipse cx="0" cy="96" rx="44" ry="9" fill="#123" opacity="0.3"/>
      <ellipse cx="0" cy="52" rx="36" ry="52" fill="#0d1726"/>
      <ellipse cx="0" cy="62" rx="23" ry="36" fill="#e8f1f7"/>
      <circle cx="0" cy="-14" r="25" fill="#0d1726"/>
      <ellipse cx="0" cy="-7" rx="16" ry="14" fill="#e8f1f7"/>
      <circle cx="-9" cy="-20" r="4" fill="#0a0f16"/>
      <circle cx="9" cy="-20" r="4" fill="#0a0f16"/>
      <path d="M -6 -11 L 8 -7 L -6 -3 Z" fill="#f5a623"/>
      <ellipse cx="-16" cy="100" rx="11" ry="5" fill="#f5a623"/>
      <ellipse cx="16" cy="100" rx="11" ry="5" fill="#f5a623"/>
    </g>
    <!-- small chick -->
    <g transform="translate(1180,700) scale(0.6)">
      <ellipse cx="0" cy="98" rx="42" ry="9" fill="#123" opacity="0.3"/>
      <ellipse cx="0" cy="54" rx="35" ry="50" fill="#0d1726"/>
      <ellipse cx="0" cy="64" rx="22" ry="34" fill="#e8f1f7"/>
      <circle cx="0" cy="-12" r="24" fill="#0d1726"/>
      <ellipse cx="0" cy="-5" rx="15" ry="13" fill="#e8f1f7"/>
      <circle cx="-9" cy="-18" r="4" fill="#0a0f16"/>
      <circle cx="9" cy="-18" r="4" fill="#0a0f16"/>
      <path d="M -6 -10 L 8 -6 L -6 -2 Z" fill="#f5a623"/>
      <ellipse cx="-15" cy="101" rx="11" ry="5" fill="#f5a623"/>
      <ellipse cx="15" cy="101" rx="11" ry="5" fill="#f5a623"/>
    </g>
  </g>

  <!-- falling snow -->
  <g fill="#ffffff">
    <circle cx="200" cy="300" r="2.2" opacity="0.5"/><circle cx="420" cy="380" r="1.8" opacity="0.4"/>
    <circle cx="700" cy="330" r="2.0" opacity="0.45"/><circle cx="980" cy="410" r="1.7" opacity="0.4"/>
    <circle cx="1260" cy="350" r="2.1" opacity="0.5"/><circle cx="1480" cy="430" r="1.8" opacity="0.4"/>
    <circle cx="340" cy="480" r="1.6" opacity="0.35"/><circle cx="820" cy="500" r="1.9" opacity="0.4"/>
    <circle cx="1120" cy="470" r="1.6" opacity="0.35"/><circle cx="90" cy="440" r="1.8" opacity="0.4"/>
    <circle cx="560" cy="540" r="1.5" opacity="0.3"/><circle cx="1340" cy="520" r="1.7" opacity="0.35"/>
  </g>
</svg>
